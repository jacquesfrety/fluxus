<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fluxus — Project Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171C; --surface:#1C2028; --surface2:#242A33; --surface3:#2C333E;
    --line:#333B47; --ink:#EDEAE1; --ink-dim:#9BA3AE; --ink-faint:#5B6472;
    --gold:#D9A441; --gold-dim:#B98A34; --teal:#4FB6AC; --blue:#3B82F6;
    --grey:#6B7280; --violet:#B08BE0; --green:#6FCF97; --red:#E5646A;
    --chart-line:#333B47; --chart-label:#5B6472; --chart-value:#9BA3AE; --chart-value-strong:#0F1216;
    --weekend-bg:rgba(255,255,255,.07); --holiday-bg:rgba(229,100,106,.16);
    --r:7px;
  }
  html[data-theme="light"]{
    --bg:#F3F4F6; --surface:#FFFFFF; --surface2:#F1F2F5; --surface3:#E5E7EB;
    --line:#DDE1E6; --ink:#171A1F; --ink-dim:#4B5563; --ink-faint:#8A94A3;
    --chart-line:#DDE1E6; --chart-label:#8A94A3; --chart-value:#4B5563; --chart-value-strong:#0F1216;
    --weekend-bg:rgba(0,0,0,.045); --holiday-bg:rgba(229,100,106,.13);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif; font-size:14px;}
  h1,h2,h3,.display{font-family:'Space Grotesk',system-ui,sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:13px;background:var(--surface2);
    color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 9px;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold-dim);}
  a{color:var(--teal);}

  #app{display:flex;height:100vh;overflow:hidden;}
  #picker{height:100vh;align-items:center;justify-content:center;}
  .picker-card{width:340px;max-width:92vw;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:28px 26px;}
  .picker-list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;margin-bottom:4px;}
  .picker-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;
    background:var(--surface2);border:1px solid var(--line);border-radius:7px;cursor:pointer;font-size:13px;}
  .picker-item:hover{border-color:var(--ink-faint);}

  /* ---- sidebar ---- */
  #sidebar{width:216px;flex:0 0 216px;background:var(--surface);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:18px 12px;}
  .brand{display:flex;align-items:center;gap:9px;padding:4px 8px 22px;border-radius:8px;}
  .brand.editable{cursor:pointer;}
  .brand.editable:hover{background:var(--surface2);}
  .brand.editable:hover .brand-name{color:var(--gold);}
  .brand-mark{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--gold),var(--teal));
    flex:0 0 auto;}
  .brand-name{font-size:21px;font-weight:800;letter-spacing:.2px;color:var(--ink);white-space:nowrap;}
  .brand-sub{font-size:10.5px;color:var(--ink-faint);margin-top:1px;}
  .fluxus-tag{font-size:16px;font-weight:700;letter-spacing:.2px;color:var(--ink);padding-left:2px;}
  .project-header{display:flex;gap:16px;align-items:flex-start;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:18px;}
  .project-header-title{font-size:20px;font-weight:700;font-family:'Space Grotesk',sans-serif;}
  .project-header-meta{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap;}
  .project-header-notes{margin-top:9px;color:var(--ink-dim);font-size:13px;white-space:pre-wrap;line-height:1.5;}
  nav{display:flex;flex-direction:column;gap:2px;}
  .nav-btn{display:flex;align-items:center;gap:10px;padding:9px 10px;border:none;background:none;
    color:var(--ink-dim);border-radius:6px;text-align:left;font-size:13.5px;font-weight:500;}
  .nav-btn:hover{background:var(--surface2);color:var(--ink);}
  .nav-btn.active{background:var(--surface2);color:var(--gold);}
  .nav-icon{width:16px;text-align:center;opacity:.85;font-size:14px;}
  .sidebar-foot{margin-top:auto;}
  .sidebar-foot-inner{padding-top:14px;border-top:1px solid var(--line);margin-top:10px;}
  .theme-toggle{display:flex;gap:4px;margin-top:10px;background:var(--surface2);border-radius:7px;padding:3px;}
  .theme-toggle button{flex:1;border:none;background:none;color:var(--ink-faint);font-size:11.5px;
    font-family:inherit;padding:6px 0;border-radius:5px;cursor:pointer;}
  html[data-theme="dark"] .theme-toggle button[data-mode="dark"],
  html[data-theme="light"] .theme-toggle button[data-mode="light"]{background:var(--surface3);color:var(--ink);font-weight:600;}
  .whoami-label{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.5px;
    margin-bottom:6px;padding-left:2px;}

  /* ---- main ---- */
  #main{flex:1;display:flex;flex-direction:column;min-width:0;}
  #topbar{padding:16px 26px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;
    justify-content:space-between;gap:16px;flex-wrap:wrap;}
  #topbar h1{font-size:19px;margin:0;font-weight:600;}
  #topbar .sub{color:var(--ink-dim);font-size:12.5px;margin-top:2px;}
  #view{flex:1;overflow:auto;padding:22px 26px 60px;}

  .btn{background:var(--surface2);border:1px solid var(--line);color:var(--ink);padding:7px 13px;
    border-radius:6px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{border-color:var(--ink-faint);}
  .btn-gold{background:var(--gold);border-color:var(--gold);color:#1A1608;font-weight:600;}
  .btn-gold:hover{background:#E5B355;}
  .btn-ghost{background:none;border-color:transparent;color:var(--ink-dim);}
  .btn-ghost:hover{color:var(--ink);background:var(--surface2);}
  .btn-sm{padding:4px 9px;font-size:12px;}
  .btn-danger{color:var(--red);}

  .pill{display:inline-block;padding:2.5px 9px;border-radius:99px;font-size:11px;font-weight:600;
    letter-spacing:.2px;white-space:nowrap;}
  .row{display:flex;align-items:center;}
  .grow{flex:1;}
  .muted{color:var(--ink-dim);}
  .faint{color:var(--ink-faint);}
  .empty-state{padding:50px 20px;text-align:center;color:var(--ink-faint);}
  .empty-state .display{color:var(--ink-dim);font-size:16px;margin-bottom:6px;}

  /* filter bar */
  .filterbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .filterbar select, .filterbar input{padding:6px 8px;font-size:12.5px;}

  /* ---- task table ---- */
  table{width:100%;border-collapse:collapse;}
  .ttable th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;
    color:var(--ink-faint);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);}
  .ttable th.sortable{cursor:pointer;user-select:none;}
  .ttable th.sortable:hover{color:var(--ink);}
  .ttable td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px;}
  .ttable tr.taskrow:hover td{background:var(--surface2);}
  .taskname{font-weight:500;cursor:pointer;}
  .taskname:hover{color:var(--gold);text-decoration:underline;}
  .task-id{color:var(--ink-faint);font-size:11px;}
  select.inline-edit, input.inline-edit{background:var(--surface3);border:1px solid var(--line);
    color:var(--ink-dim);font:inherit;font-size:12.5px;padding:3px 6px;border-radius:5px;cursor:pointer;
    max-width:140px;}
  input.inline-edit.pct-input{width:44px;max-width:44px;-moz-appearance:textfield;text-align:right;}
  input.inline-edit.pct-input::-webkit-outer-spin-button,
  input.inline-edit.pct-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  select.inline-edit:hover, input.inline-edit:hover{border-color:var(--ink-faint);}
  select.inline-edit:focus, input.inline-edit:focus{outline:none;border-color:var(--gold-dim);cursor:text;}
  input.inline-edit[type=date]{max-width:120px;cursor:text;}
  input.inline-edit[type=number]{max-width:48px;cursor:text;text-align:right;}
  .dep-warn{color:var(--red);font-size:11px;margin-top:2px;}
  .dep-ok{color:var(--green);font-size:11px;margin-top:2px;}
  .listtag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--surface3);
    color:var(--ink-dim);}
  .tasklisttag{display:inline-block;font-size:10.5px;padding:1.5px 7px;border-radius:5px;
    border:1px solid var(--line);color:var(--ink-dim);background:none;}
  .tagpill{display:inline-block;font-size:10.5px;padding:2.5px 8px;border-radius:5px;font-weight:600;
    white-space:nowrap;}
  .statuspill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
    padding:3px 9px;border-radius:99px;white-space:nowrap;}
  .bar-track{width:64px;height:5px;background:var(--surface3);border-radius:3px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--teal);}

  /* ---- kanban ---- */
  .kanban{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:10px;}
  .kcol{flex:0 0 262px;background:var(--surface2);border:1px solid var(--surface3);border-radius:var(--r);
    min-height:120px;box-shadow:0 3px 10px rgba(0,0,0,.22);}
  .kcol-head{padding:10px 12px;font-size:12.5px;font-weight:700;border-top-left-radius:var(--r);
    border-top-right-radius:var(--r);display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid rgba(255,255,255,.06);}
  .kcol-body{padding:9px;display:flex;flex-direction:column;gap:8px;min-height:60px;}
  .kcol-body.dragover{background:var(--surface3);}
  .kcard{background:var(--surface3);border:1px solid var(--line);border-radius:6px;padding:10px 11px;
    cursor:pointer;}
  .kcard:hover{border-color:var(--ink-faint);}
  .kcard.kcard-danger{background:rgba(229,100,106,.16);border-color:var(--red);}
  .kcard .tagpill{margin-bottom:6px;margin-right:4px;}
  .kcard-name{font-size:13px;font-weight:500;line-height:1.35;margin-bottom:6px;}
  .kcard-meta{font-size:11.5px;color:var(--ink-dim);display:flex;justify-content:space-between;align-items:center;}
  .kcard-warn{margin-top:6px;font-size:11px;color:#FFC2C5;font-weight:600;}

  /* ---- timeline ---- */
  .tl-controls{display:flex;gap:14px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .tl-zoom{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-dim);}
  .tl-zoom input[type=range]{width:110px;}
  .tl-scrollctl{display:flex;align-items:center;gap:8px;margin-top:10px;}
  .tl-scrollctl input[type=range]{flex:1;}
  .tl-outer{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;}
  .tl-labels{flex:0 0 520px;min-width:200px;background:var(--surface);border-right:1px solid var(--line);}
  .tl-resize-handle{flex:0 0 6px;cursor:col-resize;background:var(--surface3);position:relative;}
  .tl-resize-handle::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:2px;height:26px;border-radius:2px;background:var(--ink-faint);}
  .tl-resize-handle:hover, .tl-resize-handle.dragging{background:var(--gold-dim);}
  .tl-resize-handle:hover::after, .tl-resize-handle.dragging::after{background:#1A1608;}
  .tl-labels-row{display:flex;align-items:center;height:38px;border-bottom:1px solid var(--line);cursor:pointer;}
  .tl-labels-row:last-child{border-bottom:none;}
  .tl-labels-row:not(.head):hover{background:var(--surface2);}
  .tl-labels-row.head{height:44px;background:var(--surface3);font-size:11px;color:var(--ink-faint);
    text-transform:uppercase;letter-spacing:.4px;cursor:default;}
  .tl-labels-row.head select.inline-edit{max-width:100%;font-size:10.5px;text-transform:none;letter-spacing:0;}
  .tl-col-task-fixed{flex:0 0 200px;padding:0 12px;display:flex;align-items:center;gap:6px;overflow:hidden;}
  .tl-col-task-fixed .task-id{flex:0 0 auto;white-space:nowrap;}
  .tl-col-task-fixed span:last-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tl-col-task-fixed>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tl-cols-scroll-outer{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;border-left:1px solid var(--line);
    scrollbar-width:none;}
  .tl-cols-scroll-outer::-webkit-scrollbar{display:none;}
  .tl-cols-scroll-inner{display:flex;align-items:center;gap:8px;padding:0 10px;width:max-content;}
  .tl-col-assignee{flex:0 0 92px;display:flex;align-items:center;gap:5px;font-size:11.5px;
    color:var(--ink-dim);overflow:hidden;}
  .tl-col-assignee>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tl-col-estimation{flex:0 0 68px;font-size:11.5px;color:var(--ink-dim);text-align:center;}
  .tl-col-category{flex:0 0 104px;overflow:hidden;}
  .tl-col-list{flex:0 0 96px;overflow:hidden;}
  .tl-cols-slider-row{display:flex;align-items:center;height:20px;background:var(--surface3);
    border-bottom:1px solid var(--line);}
  .tl-cols-slider-spacer{flex:0 0 200px;}
  .tl-cols-slider-wrap{flex:1;min-width:0;padding:0 8px;border-left:1px solid var(--line);}
  .tl-cols-slider-wrap input[type=range]{width:100%;height:14px;margin:0;display:block;}
  .tl-scrollarea{flex:1;overflow-x:auto;overflow-y:hidden;background:var(--surface);}
  .tl-inner{position:relative;}
  .tl-daycol{position:absolute;top:0;border-left:1px solid var(--line);opacity:.45;}
  .tl-daycol.month-start{opacity:1;border-left:1px solid var(--ink-faint);}
  .tl-weekend{position:absolute;top:0;background:var(--weekend-bg);}
  .tl-weekend.tl-holiday{background:var(--holiday-bg);}
  .tl-monthlabel{position:absolute;top:5px;font-size:11px;font-weight:600;color:var(--ink-dim);
    white-space:nowrap;}
  .tl-daynum{position:absolute;top:24px;font-size:10px;color:var(--chart-label);text-align:center;}
  .tl-headerband{height:44px;border-bottom:1px solid var(--line);position:relative;background:var(--surface3);}
  .tl-cal-slider-row{position:sticky;left:0;top:0;height:20px;background:var(--surface3);
    border-bottom:1px solid var(--line);z-index:8;display:flex;align-items:center;padding:0;box-sizing:border-box;}
  .tl-cal-slider-row input[type=range]{width:100%;display:block;}
  .tl-rowband{position:absolute;left:0;right:0;height:38px;border-bottom:1px solid var(--line);}
  .tl-today{position:absolute;top:0;border-left:2px solid var(--gold);z-index:3;}
  .tl-bar{position:absolute;top:7px;height:24px;border-radius:5px;cursor:grab;display:flex;
    align-items:center;padding:0 8px;font-size:11px;color:#101317;font-weight:600;white-space:nowrap;
    overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.3) inset;z-index:2;}
  .tl-bar-avatar{position:absolute;z-index:6;}
  .tl-conflict-badge{position:absolute;height:13px;border-radius:3px 3px 0 0;background:var(--red);
    color:#fff;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;
    cursor:pointer;z-index:6;box-shadow:0 0 0 1px var(--surface);}
  .tl-conflict-badge:hover{background:#ff7b81;}

  /* ---- dashboard ---- */
  .dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:18px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;}
  .card h3{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-faint);
    margin:0 0 12px;font-weight:600;}
  .stat-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px;}
  .stat-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px;}
  .bignum{font-size:34px;font-weight:700;font-family:'Space Grotesk',sans-serif;}
  .bignum.warn{color:var(--red);}
  .dash-list-card{margin-bottom:14px;}
  #drive-dropzone{transition:border-color .15s,background .15s;}
  #drive-dropzone.drive-drag-over{border-color:var(--gold);background:rgba(217,164,65,.06);}
  .dash-2col{display:flex;gap:14px;align-items:stretch;margin-bottom:14px;}
  .dash-2col > div{flex:1;min-width:0;}
  .dash-2col .dash-list-card{margin-bottom:0;height:100%;}
  .dash-2col .project-header{margin-bottom:0;height:100%;}
  .dash-task-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 2px;
    border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px;}
  .dash-task-row:last-child{border-bottom:none;}
  .dash-task-row:hover{background:var(--surface2);}
  .dash-task-main{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    display:flex;align-items:center;gap:7px;}
  .dash-task-side{display:flex;align-items:center;gap:10px;flex:0 0 auto;font-size:11.5px;color:var(--ink-dim);}
  .dash-more{padding-top:8px;font-size:12px;color:var(--teal);cursor:pointer;}
  .dash-more:hover{text-decoration:underline;}
  /* ---- forum / PMS support ---- */
  .forum-post-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:14px 16px;margin-bottom:10px;cursor:pointer;}
  .forum-post-card:hover{border-color:var(--ink-faint);}
  .forum-post-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
  .forum-post-title{font-weight:600;font-size:14px;flex:1;min-width:0;}
  .forum-post-desc{font-size:12.5px;color:var(--ink-dim);line-height:1.5;margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .forum-post-meta{font-size:11.5px;color:var(--ink-faint);display:flex;align-items:center;gap:14px;margin-top:10px;flex-wrap:wrap;}
  .forum-vote-btn{display:flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--line);
    border-radius:6px;padding:3px 10px;font-size:12px;color:var(--ink-dim);cursor:pointer;}
  .forum-vote-btn:hover{border-color:var(--ink-faint);}
  .forum-vote-btn.voted{background:rgba(217,164,65,.16);border-color:var(--gold-dim);color:var(--gold);font-weight:600;}

  /* ---- documents ---- */
  .doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;}
  .doc-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;}
  .doc-card:hover{border-color:var(--ink-faint);}
  .doc-thumb{width:100%;height:110px;background:var(--surface2);display:flex;align-items:center;
    justify-content:center;font-size:34px;overflow:hidden;}
  .doc-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .doc-card-body{padding:10px 12px;}
  .doc-card-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .doc-card-meta{font-size:11px;color:var(--ink-faint);margin-top:6px;display:flex;align-items:center;
    justify-content:space-between;gap:6px;}
  .chart-legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:16px;padding-top:14px;
    border-top:1px solid var(--line);}
  .chart-legend-item{font-size:12px;color:var(--ink-dim);display:flex;align-items:center;gap:6px;}
  .chart-legend-item[onclick]:hover{color:var(--gold);}
  .chart-legend-dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:0 0 auto;}
  .assignee-chart{display:flex;flex-direction:column;}
  .assignee-row{display:flex;align-items:center;gap:10px;padding:6px 0;}
  .assignee-label{flex:0 0 132px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .assignee-label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .assignee-barwrap{flex:1;display:flex;align-items:center;gap:8px;min-width:0;}
  .assignee-bar{flex:1;display:flex;height:22px;border-radius:4px;overflow:hidden;background:var(--surface3);}
  .assignee-seg{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;
    color:#101317;white-space:nowrap;}
  .assignee-total{flex:0 0 26px;font-size:12px;font-weight:600;color:var(--ink-dim);text-align:right;}
  .assignee-axis{display:flex;margin-top:2px;}
  .assignee-axis-spacer{flex:0 0 132px;}

</style>
</head>

<script>
/* ============================= constants ============================= */
const STATUSES = ["Not Started","In Progress","In Review","Completed","Needs Revision","On Hold"];
const STATUS_COLOR = {"Not Started":"var(--grey)","In Progress":"var(--blue)","In Review":"var(--violet)","Completed":"var(--green)","Needs Revision":"var(--teal)","On Hold":"var(--red)"};
const STATUS_HEX = {"Not Started":"#6B7280","In Progress":"#3B82F6","In Review":"#B08BE0","Completed":"#6FCF97","Needs Revision":"#4FB6AC","On Hold":"#E5646A"};
const PRIORITIES = ["Low","Medium","High"];
const PRIORITY_COLOR = {"Low":"var(--green)","Medium":"var(--gold)","High":"var(--red)"};
const PRIORITY_HEX = {"Low":"#6FCF97","Medium":"#D9A441","High":"#E5646A"};
const ROLES = ["Supervisor","Student Lead","Student","Lecturer"];
const DEFAULT_ROLE = "Student";
const PROJECT_TYPES = ["Client","Internal","Students"];
const PROJECT_TYPE_COLOR = {"Client":"#D9A441","Internal":"#4FB6AC","Students":"#3B82F6"};
const FORUM_TYPES = ["Bug","Feature Request"];
const FORUM_TYPE_COLOR = {"Bug":"#E5646A","Feature Request":"#4FB6AC"};
const FORUM_STATUSES = ["Open","Planned","In Progress","Resolved","Declined"];
const FORUM_STATUS_COLOR = {"Open":"#6B7280","Planned":"#3B82F6","In Progress":"#D9A441","Resolved":"#6FCF97","Declined":"#8A94A3"};
const DOC_TYPES = ["Image","Video","Document","Website","Folder","Other"];
const DOC_TYPE_ICON = {"Image":"🖼","Video":"🎬","Document":"📄","Website":"🌐","Folder":"📁","Other":"🔗"};
const DOC_TYPE_COLOR = {"Image":"#3B82F6","Video":"#B08BE0","Document":"#4FB6AC","Website":"#7FA8D9","Folder":"#D9A441","Other":"#6B7280"};

/* ============================= firebase ============================= */
const firebaseConfig = {
  apiKey: "AIzaSyD8zC3Q78dan_ceYrHqCv0fl36c1dtNNG0",
  authDomain: "pms-project-b11da.firebaseapp.com",
  projectId: "pms-project-b11da",
  storageBucket: "pms-project-b11da.firebasestorage.app",
  messagingSenderId: "789284988664",
  appId: "1:789284988664:web:488a48e861fe0768923d0d"
};
let db = null;
let auth = null;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  auth = firebase.auth();
}catch(e){ console.error('Firebase init failed', e); }

/* ---- app sign-in (real Google identity, via Firebase Auth) ---- */
let authUser = null; // Firebase Auth user object; independent of which project is open
const googleAuthProvider = auth ? new firebase.auth.GoogleAuthProvider() : null;
function syncCurrentUserFromAuth(){
  if(!authUser){ state.currentUser = ''; return; }
  const email = (authUser.email||'').toLowerCase();
  const match = state.team.find(m => m.email && m.email.toLowerCase()===email);
  state.currentUser = match ? match.name : '';
}
async function signInApp(){
  if(!auth || !googleAuthProvider){ toast('Sign-in is still loading — try again in a moment'); return; }
  try{ await auth.signInWithPopup(googleAuthProvider); }
  catch(e){ console.error(e); toast('Sign-in failed'); }
}
async function signOutApp(){
  try{ await auth.signOut(); }catch(e){ console.error(e); }
}
let authReadyResolve;
const authReady = new Promise(resolve => { authReadyResolve = resolve; });
if(auth){
  let firstAuthCallback = true;
  auth.onAuthStateChanged((user)=>{
    authUser = user;
    syncCurrentUserFromAuth();
    if(firstAuthCallback){ firstAuthCallback = false; authReadyResolve(); }
    else if(state.projectId){ render(); } else { showPicker(); }
  });
} else {
  authReadyResolve();
}

/* ---- google drive (real read/write, via OAuth) ---- */
const GOOGLE_CLIENT_ID = '335855484636-f30688quamr1366ejqnqeo1fgev0o3vu.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive';
let driveAccessToken = null;
let driveTokenClient = null;
function initDriveAuth(){
  if(driveTokenClient || typeof google === 'undefined' || !google.accounts) return;
  driveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: (resp)=>{
      if(resp.error){ toast('Google sign-in failed'); return; }
      driveAccessToken = resp.access_token;
      state.driveSignedIn = true;
      const rootId = driveFolderId(state.project.driveUrl);
      state.driveCurrentFolderId = rootId;
      state.driveBreadcrumb = [{id: rootId, name: 'Team drive'}];
      state.driveFiles = null;
      render();
      loadDriveFolder(rootId);
    }
  });
}
function signInGoogleDrive(){
  initDriveAuth();
  if(!driveTokenClient){ toast('Google sign-in is still loading — try again in a moment'); return; }
  driveTokenClient.requestAccessToken();
}
function driveHeaders(extra){
  return Object.assign({ Authorization: 'Bearer ' + driveAccessToken }, extra||{});
}
async function driveApiList(folderId){
  const q = encodeURIComponent(`'${folderId}' in parents and trashed=false`);
  const fields = encodeURIComponent('files(id,name,mimeType,webViewLink,iconLink,thumbnailLink,modifiedTime,size)');
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=${fields}&orderBy=folder,name&pageSize=300`, {
    headers: driveHeaders()
  });
  if(!res.ok) throw new Error('list failed: '+res.status);
  const data = await res.json();
  return data.files || [];
}
async function driveApiUpload(file, folderId){
  const metadata = { name: file.name, parents: [folderId] };
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(metadata)], {type:'application/json'}));
  form.append('file', file);
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,thumbnailLink,webViewLink,mimeType', {
    method: 'POST', headers: driveHeaders(), body: form
  });
  if(!res.ok) throw new Error('upload failed: '+res.status);
  return res.json();
}
async function driveApiCreateFolder(name, parentId){
  const res = await fetch('https://www.googleapis.com/drive/v3/files?fields=id,name,mimeType', {
    method: 'POST', headers: driveHeaders({'Content-Type':'application/json'}),
    body: JSON.stringify({ name, mimeType:'application/vnd.google-apps.folder', parents:[parentId] })
  });
  if(!res.ok) throw new Error('create folder failed: '+res.status);
  return res.json();
}
async function driveApiFindOrCreateFolder(name, parentId){
  const safeName = name.replace(/'/g, "\\'");
  const q = encodeURIComponent(`name='${safeName}' and '${parentId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, { headers: driveHeaders() });
  if(!res.ok) throw new Error('folder search failed: '+res.status);
  const data = await res.json();
  if(data.files && data.files.length>0) return data.files[0].id;
  const created = await driveApiCreateFolder(name, parentId);
  return created.id;
}
async function ensureTaskDriveFolder(task){
  const rootId = driveFolderId(state.project.driveUrl);
  if(!rootId) throw new Error('no team drive folder configured for this project');
  if(!state.project.tasksFolderId){
    state.project.tasksFolderId = await driveApiFindOrCreateFolder('Tasks', rootId);
    await saveProject();
  }
  if(!task.driveFolderId){
    task.driveFolderId = await driveApiFindOrCreateFolder(task.id, state.project.tasksFolderId);
    await saveTasks();
  }
  return task.driveFolderId;
}
function driveThumbLarge(thumbnailLink, size){
  if(!thumbnailLink) return '';
  return /=s\d+$/.test(thumbnailLink) ? thumbnailLink.replace(/=s\d+$/, '=s'+(size||1600)) : thumbnailLink;
}
async function chatImgError(img){
  const taskId = img.dataset.taskId, msgId = img.dataset.msgId;
  const msgs = state.chatCache[taskId] || [];
  const msg = msgs.find(x=>x.id===msgId);
  if(!msg || !msg.driveFile) return;
  const fallbackLink = (label)=>{
    const a = document.createElement('a');
    a.href = msg.driveFile.webViewLink || '#';
    a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.className = 'chat-action-link';
    a.textContent = label;
    img.replaceWith(a);
  };
  if(img.dataset.retried){ fallbackLink('🖼 Photo (preview link expired — open in Drive)'); return; }
  img.dataset.retried = '1';
  if(!state.driveSignedIn){ fallbackLink('🖼 Photo (sign in to Google, then reload, to preview here)'); return; }
  try{
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${msg.driveFile.id}?fields=thumbnailLink,webViewLink`, { headers: driveHeaders() });
    if(!res.ok) throw new Error('refresh failed: '+res.status);
    const data = await res.json();
    msg.driveFile.thumbnailLink = data.thumbnailLink || msg.driveFile.thumbnailLink;
    msg.driveFile.webViewLink = data.webViewLink || msg.driveFile.webViewLink;
    img.src = msg.driveFile.thumbnailLink;
    img.onclick = () => openLightbox(driveThumbLarge(msg.driveFile.thumbnailLink, 1600));
    await saveChat(taskId, msgs); // persist the refreshed link so it's fast next time
  }catch(e){
    console.error(e);
    fallbackLink('🖼 Photo (open in Drive)');
  }
}
async function driveApiRename(fileId, newName){
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=id,name`, {
    method: 'PATCH', headers: driveHeaders({'Content-Type':'application/json'}),
    body: JSON.stringify({ name: newName })
  });

function ensureCategoryShape(arr){

function lsGet(key, def){
  try{ const v = localStorage.getItem(key); return v!==null ? JSON.parse(v) : def; }catch(e){ return def; }
}
function lsSet(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}

async function fsGet(key){
  if(!db || !state.projectId) return null;
  try{
    const snap = await db.collection('projects').doc(state.projectId).collection('store').doc(key).get();
    return snap.exists ? JSON.parse(snap.data().value) : null;
  }catch(e){ console.error(e); return null; }

async function loadAll(){
  try{
    const [categories, taskLists, tasks, team, project, notifications, forumPosts, documents] = await Promise.all([
      fsGet('categories'), fsGet('taskLists'), fsGet('tasks'),
      fsGet('team'), fsGet('project'),
      fsGet('notifications'), fsGet('forumPosts'), fsGet('documents')
    ]);
    state.team = team || [];
    state.tasks = tasks || [];
    state.project = Object.assign({title:"Untitled Project", icon:"", type:"Students", period:"", notes:"", nonWorkingDays:[], driveUrl:""}, project||{});
    state.notifications = notifications || [];
    state.forumPosts = forumPosts || [];
    state.documents = documents || [];
    state.timelineLabelsWidth = lsGet('timelineLabelsWidth', 520);
    state.theme = lsGet('theme', 'dark');
    document.documentElement.setAttribute('data-theme', state.theme);
    if(categories !== null){
      // current shape: categories + taskLists are already separate
      state.categories = ensureCategoryShape(categories);
      state.taskLists = taskLists || [];
    } else if(taskLists !== null){
      // migrating from the older shape, where 'taskLists' held what are now categories
      state.categories = ensureCategoryShape(taskLists);
      state.taskLists = [];
      state.tasks.forEach(t=>{ if(t.taskList && !t.category){ t.category = t.taskList; t.taskList = ""; } });
      await saveCategories(); await saveTaskListGroups(); await saveTasks();
    } else {
      state.categories = []; state.taskLists = [];
    }
    // normalize roles to the fixed set, and guarantee at least one Supervisor exists once someone's on the team
    let roleChanged = false;
    state.team.forEach(m=>{ if(!ROLES.includes(m.role)){ m.role = DEFAULT_ROLE; roleChanged = true; } });
    if(state.team.length && !state.team.some(m=>m.role==='Supervisor')){ state.team[0].role = 'Supervisor'; roleChanged = true; }
    if(roleChanged) await saveTeam();
    // migrate old status names (Done -> Completed, Blocked -> On Hold)
    const STATUS_MIGRATE = {"Done":"Completed","Blocked":"On Hold"};
    let statusChanged = false;
    state.tasks.forEach(t=>{ if(STATUS_MIGRATE[t.status]){ t.status = STATUS_MIGRATE[t.status]; statusChanged = true; } });
    // backfill fields added for the Reports page, for tasks saved before it existed
    state.tasks.forEach(t=>{
      if(t.revisionCount===undefined){ t.revisionCount = 0; statusChanged = true; }
      if(t.completedAt===undefined){
        t.completedAt = (t.status==='Completed') ? (t.due || todayISO()) : null;
        statusChanged = true;
      }
    });
    // migrate single "assignee" (string) to "assignees" (array), for tasks saved before multi-assignee support
    state.tasks.forEach(t=>{
      if(!Array.isArray(t.assignees)){
        t.assignees = t.assignee ? [t.assignee] : [];
        delete t.assignee;
        statusChanged = true;
      }
    });
    if(statusChanged) await saveTasks();
    syncCurrentUserFromAuth();
  }catch(e){
    console.error(e);
    toast("Could not load data — check your connection.");
  }
}

/* ============================= dependency logic ============================= */
function dependencyStatus(task){
  if(!task.dependsOn || task.dependsOn.length===0) return {state:"none"};
  const preds = task.dependsOn.map(id=>state.tasks.find(t=>t.id===id)).filter(Boolean);
  if(preds.length !== task.dependsOn.length) return {state:"unknown", text:"References a task that no longer exists"};
  if(!task.start) return {state:"none"};
  const maxDue = preds.reduce((m,p)=> p.due && (!m || p.due>m) ? p.due : m, null);
  if(maxDue && task.start < maxDue){
    return {state:"warn", text:`Starts before ${task.dependsOn.join(", ")} ${preds.length>1?'end':'ends'} (${fmtDate(maxDue)})`};
  }
  return {state:"ok"};
}
function isOverdue(task){
  if(task.status === "Completed" || !task.due) return false;
  return task.due < todayISO();
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return "—";
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

async function deleteProjectData(projectId){

  const [storeSnap, chatsSnap] = await Promise.all([

    projectRef.collection('chats').get()
  ]);
  const batch = db.batch();

  await batch.commit();

function esc(s){ return (s??'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function polarToCartesian(cx, cy, r, angleDeg){
  const rad = (angleDeg-90) * Math.PI/180;
  return {x: cx + r*Math.cos(rad), y: cy + r*Math.sin(rad)};
}
function describeArc(cx, cy, r, startAngle, endAngle){
  const start = polarToCartesian(cx, cy, r, endAngle);
  const end = polarToCartesian(cx, cy, r, startAngle);
  const largeArcFlag = endAngle-startAngle <= 180 ? "0" : "1";
  return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArcFlag} 0 ${end.x} ${end.y} Z`;
}
function pieChartSVG(data, size){
  size = size || 110;
  const total = data.reduce((s,d)=>s+d.value,0);
  if(total===0) return `<div class="faint" style="width:${size}px;text-align:center;padding:${size/2-10}px 0">No tasks yet</div>`;
  const cx=size/2, cy=size/2, r=size/2-1;
  let angle = 0;
  const slices = data.filter(d=>d.value>0).map(d=>{
    const sweep = d.value/total*360;
    const path = sweep>=359.9
      ? `M ${cx} ${cy-r} A ${r} ${r} 0 1 1 ${cx-0.01} ${cy-r} Z`
      : describeArc(cx, cy, r, angle, angle+sweep);
    angle += sweep;
    return `<path d="${path}" fill="${d.color}" ${d.onclick?`style="cursor:pointer" onclick="${esc(d.onclick)}"`:''}><title>${esc(d.label)}: ${d.value}</title></path>`;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:0 0 auto">${slices}</svg>`;
}
function niceAxisMax(v){
  if(v<=0) return 1;
  const magnitude = Math.pow(10, Math.floor(Math.log10(v)));
  const residual = v/magnitude;
  let nice;
  if(residual<=1) nice=1; else if(residual<=2) nice=2; else if(residual<=5) nice=5; else nice=10;
  return nice*magnitude;
}
function formatNum(v){
  if(Number.isInteger(v)) return String(v);
  return (Math.round(v*100)/100).toString();
}
function labelShort(s){ return s.length>10 ? s.slice(0,9)+'…' : s; }
function verticalBarChart(categories, series, opts){
  opts = opts || {};
  const width = opts.width || 480, height = opts.height || 220;
  const stacked = !!opts.stacked;
  const padTop=22, padBottom=32, padLeft=6, padRight=6;
  const plotH = height-padTop-padBottom, plotW = width-padLeft-padRight;
  const n = categories.length;
  if(n===0) return `<div class="faint" style="padding:20px 0;text-align:center">No data yet</div>`;
  const groupW = plotW/n;
  const barGap = 5;
  let bars='', catLabels='';

  if(stacked){
    const totals = categories.map((_,i)=> series.reduce((s,se)=>s+(se.values[i]||0),0));
    const axisMax = niceAxisMax(Math.max(...totals, 0));
    const barW = Math.max(10, groupW - barGap*2);
    categories.forEach((cat,i)=>{
      const groupX = padLeft + i*groupW;
      const x = groupX + (groupW-barW)/2;
      let cumTop = padTop + plotH;
      series.forEach(s=>{
        const val = s.values[i]||0;
        const barH = axisMax>0 ? (val/axisMax*plotH) : 0;
        const y = cumTop - barH;
        const color = s.colors ? s.colors[i] : s.color;
        if(val>0){
          bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" fill="${color}"><title>${esc(cat)} — ${esc(s.name)}: ${formatNum(val)}</title></rect>`;
          if(barH>13) bars += `<text x="${(x+barW/2).toFixed(1)}" y="${(y+barH/2+3.5).toFixed(1)}" font-size="9.5" style="fill:var(--chart-value-strong)" text-anchor="middle" font-weight="700">${formatNum(val)}</text>`;
        }
        cumTop = y;
      });
      if(totals[i]>0) bars += `<text x="${(x+barW/2).toFixed(1)}" y="${(cumTop-5).toFixed(1)}" font-size="10" style="fill:var(--chart-value)" text-anchor="middle" font-weight="600">${formatNum(totals[i])}</text>`;
      catLabels += `<text x="${(groupX+groupW/2).toFixed(1)}" y="${(height-14).toFixed(1)}" font-size="10" style="fill:var(--chart-label)" text-anchor="middle">${esc(labelShort(cat))}</text>`;
    });
  } else {
    const allVals = series.flatMap(s=>s.values);
    const axisMax = niceAxisMax(Math.max(...allVals, 0));
    const seriesCount = series.length;
    const barW = Math.max(5, (groupW-barGap*(seriesCount+1))/seriesCount);
    categories.forEach((cat,i)=>{
      const groupX = padLeft + i*groupW;
      series.forEach((s,si)=>{
        const val = s.values[i]||0;
        const barH = axisMax>0 ? (val/axisMax*plotH) : 0;
        const x = groupX + barGap + si*(barW+barGap);
        const y = padTop + (plotH-barH);
        const color = s.colors ? s.colors[i] : s.color;
        bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="3" fill="${color}"><title>${esc(cat)} — ${esc(s.name)}: ${formatNum(val)}</title></rect>`;
        if(barH>13){
          bars += `<text x="${(x+barW/2).toFixed(1)}" y="${(y-4).toFixed(1)}" font-size="9.5" style="fill:var(--chart-value)" text-anchor="middle">${formatNum(val)}</text>`;
        }
      });
      catLabels += `<text x="${(groupX+groupW/2).toFixed(1)}" y="${(height-14).toFixed(1)}" font-size="10" style="fill:var(--chart-label)" text-anchor="middle">${esc(labelShort(cat))}</text>`;
    });
  }
  const axisLine = `<line x1="${padLeft}" y1="${padTop+plotH}" x2="${width-padRight}" y2="${padTop+plotH}" style="stroke:var(--chart-line)" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">${axisLine}${bars}${catLabels}</svg>`;
}

    (!state.filters.taskList || t.taskList===state.filters.taskList) &&
    (!state.filters.assignee || (t.assignees||[]).includes(state.filters.assignee)) &&
    (!state.filters.status || t.status===state.filters.status) &&
    (!q || (t.name||'').toLowerCase().includes(q) || (t.notes||'').toLowerCase().includes(q))
  );
}
function filteredTasksForTimeline(){
  return state.tasks.filter(t=>
    (!state.timelineFilters.category || t.category===state.timelineFilters.category) &&
    (!state.timelineFilters.taskList || t.taskList===state.timelineFilters.taskList) &&
    (!state.timelineFilters.assignee || (t.assignees||[]).includes(state.timelineFilters.assignee))
  );
}
function compareTasks(a,b,key,dir){
  let av,bv;
  switch(key){
    case 'name': av=(a.name||'').toLowerCase(); bv=(b.name||'').toLowerCase(); break;
    case 'category': av=(a.category||'').toLowerCase(); bv=(b.category||'').toLowerCase(); break;
    case 'taskList': av=(a.taskList||'').toLowerCase(); bv=(b.taskList||'').toLowerCase(); break;
    case 'assignee': av=(a.assignees||[]).join(', ').toLowerCase(); bv=(b.assignees||[]).join(', ').toLowerCase(); break;
    case 'status': av=STATUSES.indexOf(a.status); bv=STATUSES.indexOf(b.status); break;
    case 'priority': av=PRIORITIES.indexOf(a.priority); bv=PRIORITIES.indexOf(b.priority); break;
    case 'due': av=a.due||''; bv=b.due||''; break;
    case 'pct': av=a.pct||0; bv=b.pct||0; break;
    default: return 0;
  }
  const cmp = av<bv?-1:av>bv?1:0;
  return dir==='asc'?cmp:-cmp;
}
function setSort(key){
  if(state.sort.key===key){ state.sort.dir = state.sort.dir==='asc'?'desc':'asc'; }
  else { state.sort.key=key; state.sort.dir='asc'; }

function sortArrow(key){

/* ============================= TIMELINE VIEW ============================= */
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function isoOf(d){ return d.toISOString().slice(0,10); }
function isNonWorkingDay(dateISO){
  return (state.project.nonWorkingDays||[]).includes(dateISO);
}
function isWorkday(d){
  return d.getDay()!==0 && d.getDay()!==6 && !isNonWorkingDay(isoOf(d));
}
function addWorkdays(startISO, days){
  if(!startISO || !days || days<1) return startISO;
  const d = new Date(startISO);
  let added = 0;
  while(added < days-1){
    d.setDate(d.getDate()+1);
    if(isWorkday(d)) added++;
  }
  return isoOf(d);
}

function progressGradient(pct, warn){
  if(warn) return 'var(--red)';
  const p = Math.max(0, Math.min(100, pct||0));
  const spread = 16; // width of the soft fade, in percentage points
  const fadeStart = Math.max(0, p - spread/2);
  const fadeEnd = Math.min(100, p + spread/2);
  return `linear-gradient(90deg, var(--green) 0%, var(--green) ${fadeStart}%, var(--gold) ${fadeEnd}%, var(--gold) 100%)`;
}

function getTaskConflicts(taskId){
  const t = state.tasks.find(x=>x.id===taskId);
  if(!t || !t.assignees || !t.assignees.length || !t.start || !t.due) return [];
  return state.tasks.filter(o=>
    o.id!==t.id && o.assignees && o.assignees.some(a=>t.assignees.includes(a)) && o.start && o.due &&
    t.start<=o.due && o.start<=t.due
  );
}
function showConflictInfo(e, taskId){
  e.stopPropagation();
  const t = state.tasks.find(x=>x.id===taskId); if(!t) return;
  const conflicts = getTaskConflicts(taskId);
  if(conflicts.length===0) return;
  const lines = conflicts.map(c=>{
    const shared = c.assignees.filter(a=>t.assignees.includes(a));
    return `• ${c.id} — ${c.name} (${fmtDate(c.start)} – ${fmtDate(c.due)}) — shared: ${shared.join(', ')}`;
  }).join('\n');
  alert(`Double-booking on "${t.name}":\n\n${lines}`);
}
function renderTimelineView(){
  const tasks = filteredTasksForTimeline().filter(t=>t.start && t.due);
  const controlsBar = `<div class="tl-controls">
    <span class="tl-zoom">
      Zoom
      <input type="range" id="tl-zoom-input" min="8" max="60" step="2" value="${state.timelineZoom||26}" oninput="setZoom(parseInt(this.value))">
    </span>
    <button class="btn btn-sm btn-ghost" onclick="scrollToToday()">Today</button>
    <span class="faint" style="font-size:11.5px">Gold line = today · gradient reflects progress · solid red / red arrow = dependency issue · ! = double-booked</span>
  </div>`;

  if(tasks.length===0){
    return controlsBar + `<div class="empty-state"><div class="display">Nothing to plot</div>No tasks match these filters with both a start and due date — try clearing a filter above, or add a new task.</div>`;
  }

  const starts = tasks.map(t=>new Date(t.start)), dues = tasks.map(t=>new Date(t.due));
  let min = addDays(new Date(Math.min(...starts)), -4);
  let max = addDays(new Date(Math.max(...dues)), 4);
  const totalDays = Math.max(1, daysBetween(min,max));
  const zoom = state.timelineZoom || 26; // px per day
  const width = totalDays * zoom;
  const rowH = 38, headH = 44;
  const totalH = headH + tasks.length*rowH;

  // day columns (gridlines, weekend/holiday shading, day numbers, month labels)
  let dayCols = '', weekendBands = '', dayNums = '', monthLabels = '';
  for(let i=0;i<=totalDays;i++){
    const d = addDays(min, i);
    const x = i*zoom;
    const isMonthStart = d.getDate()===1;
    const dISO = isoOf(d);
    const isWeekend = d.getDay()===0 || d.getDay()===6;
    const isHoliday = isNonWorkingDay(dISO);
    dayCols += `<div class="tl-daycol ${isMonthStart?'month-start':''}" style="left:${x}px;height:${totalH}px"></div>`;
    if(isWeekend || isHoliday){
      weekendBands += `<div class="tl-weekend ${isHoliday?'tl-holiday':''}" style="left:${x}px;width:${zoom}px;height:${totalH}px" title="${isHoliday?'Non-working day':'Weekend'}"></div>`;
    }
    if(zoom>=14){
      dayNums += `<div class="tl-daynum" style="left:${x}px;width:${zoom}px">${d.getDate()}</div>`;
    }
    if(isMonthStart || i===0){
      monthLabels += `<div class="tl-monthlabel" style="left:${x+3}px">${d.toLocaleDateString('en-GB',{month:'short',year:'2-digit'})}</div>`;
    }
  }
  const todayOffset = daysBetween(min, todayISO());
  const todayLine = (todayOffset>=0 && todayOffset<=totalDays)
    ? `<div class="tl-today" style="left:${todayOffset*zoom}px;height:${totalH}px"></div>` : '';

  const rowBands = tasks.map((t,i)=>`<div class="tl-rowband" style="top:${headH+i*rowH}px"></div>`).join('');

  const barRects = {};
  const bars = tasks.map((t,i)=>{
    const dep = dependencyStatus(t);
    const warn = dep.state==='warn'||dep.state==='unknown';
    const left = Math.max(0, daysBetween(min,t.start))*zoom;
    const rightDay = Math.max(daysBetween(min,t.start)+1, daysBetween(min,t.due)+1);
    const w = Math.max(zoom*1.1, rightDay*zoom - left);
    const top = headH + i*rowH + 7;
    barRects[t.id] = {left, right: left+w, midY: top+12};

    const conflicts = getTaskConflicts(t.id);
    let badge = '';
    if(conflicts.length>0){
      const overlapDays = new Set();
      conflicts.forEach(c=>{
        const os = t.start>c.start ? t.start : c.start; // later of the two starts = day overlap begins
        overlapDays.add(os);
      });
      badge = [...overlapDays].map(day=>{
        const dayIndex = daysBetween(min, day);
        const bx = dayIndex*zoom;
        return `<div class="tl-conflict-badge" style="left:${bx.toFixed(1)}px;width:${zoom.toFixed(1)}px;top:${top-6}px" onclick="showConflictInfo(event,'${t.id}')" title="${esc(assigneeNamesLabel(t.assignees))} double-booked from ${fmtDate(day)} — click for details">!</div>`;
      }).join('');
    }

    const assigneeIcon = (t.assignees && t.assignees.length)
      ? `<span style="margin-left:auto;padding-left:5px;flex:0 0 auto;display:flex" title="${esc(assigneeNamesLabel(t.assignees))}">${avatarsForNames(t.assignees,18)}</span>`
      : '';
    return `<div class="tl-bar" data-task-id="${t.id}" onclick="handleBarClick(event,'${t.id}')"
      style="left:${left}px;width:${w}px;top:${top}px;background:${progressGradient(t.pct,warn)};color:${warn?'#fff':'#101317'}"
      title="${esc(t.name)} — ${t.pct||0}% — drag to move"><span>${t.pct||0}%</span>${assigneeIcon}</div>${badge}`;
  }).join('');

  const depArrows = [];
  tasks.forEach(t=>{
    (t.dependsOn||[]).forEach(depId=>{
      const pred = barRects[depId], succ = barRects[t.id];
      if(!pred || !succ) return; // predecessor not visible under current filters
      const warn = dependencyStatus(t).state==='warn' || dependencyStatus(t).state==='unknown';
      const stroke = warn ? 'var(--red)' : 'var(--ink-faint)';
      const marker = warn ? 'url(#tl-arrow-warn)' : 'url(#tl-arrow)';
      const midX = pred.right + 10;
      const d = `M ${pred.right} ${pred.midY} L ${midX} ${pred.midY} L ${midX} ${succ.midY} L ${succ.left-2} ${succ.midY}`;

  return controlsBar + `

function wireTimelineControls(){
  const area = document.getElementById('tl-scrollarea');
  const slider = document.getElementById('tl-scroll-input');
  if(!area || !slider) return;
  const maxScroll = () => Math.max(1, area.scrollWidth - area.clientWidth);
  slider.max = maxScroll();
  area.addEventListener('scroll', ()=>{ slider.value = area.scrollLeft; });
  // restore previous relative scroll position after re-render
  if(state.timelineScrollFrac!=null){
    area.scrollLeft = state.timelineScrollFrac * maxScroll();
  }
  area.addEventListener('scroll', ()=>{ state.timelineScrollFrac = area.scrollLeft / maxScroll(); });
}
let ganttDragMoved = false;
function handleBarClick(e, taskId){
  if(ganttDragMoved){ ganttDragMoved = false; return; }
  openDrawer(taskId);
}
function wireTimelineResize(){
  const handle = document.getElementById('tl-resize-handle');
  const labels = document.getElementById('tl-labels');
  if(!handle || !labels) return;
  handle.addEventListener('mousedown', (e)=>{
    if(e.button!==0) return;
    e.preventDefault();
    const startX = e.clientX;
    const initialWidth = labels.getBoundingClientRect().width;
    let currentWidth = initialWidth;
    handle.classList.add('dragging');
    function onMove(ev){
      // 200 = the Task column's fixed width; below that there'd be no room left for it at all
      currentWidth = Math.max(200, Math.min(820, initialWidth + (ev.clientX - startX)));
      labels.style.flex = `0 0 ${currentWidth}px`;
    }
    async function onUp(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      handle.classList.remove('dragging');
      state.timelineLabelsWidth = Math.round(currentWidth);
      await saveTimelineLabelsWidth();
      render();
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}
function wireOtherColsSync(){
  const scrollers = document.querySelectorAll('.other-cols-scroll');
  const slider = document.getElementById('tl-cols-slider');
  if(!scrollers.length) return;
  const maxScroll = () => Math.max(1, scrollers[0].scrollWidth - scrollers[0].clientWidth);
  if(slider) slider.max = maxScroll();
  scrollers.forEach(el=>{
    el.addEventListener('scroll', ()=>{
      scrollers.forEach(other=>{ if(other!==el) other.scrollLeft = el.scrollLeft; });
      if(slider) slider.value = el.scrollLeft;
    });
  });
}
function scrollOtherColsFromSlider(v){
  const scrollers = document.querySelectorAll('.other-cols-scroll');
  if(!scrollers.length) return;
  scrollers.forEach(el=> el.scrollLeft = v);
}
function wireTimelineDrag(){
  document.querySelectorAll('.tl-bar').forEach(bar=>{
    bar.addEventListener('mousedown', (e)=>{
      if(e.button!==0) return;
      const taskId = bar.dataset.taskId;
      const task = state.tasks.find(x=>x.id===taskId);
      if(!task || !task.start) return;
      const zoom = state.timelineZoom || 26;
      const startX = e.clientX;
      const initialLeft = parseFloat(bar.style.left) || 0;
      let moved = false;
      e.preventDefault();
      function onMove(ev){
        const dx = ev.clientX - startX;
        if(Math.abs(dx) > 3) moved = true;
        if(moved){
          bar.style.left = (initialLeft + dx) + 'px';
          bar.style.cursor = 'grabbing';
          bar.style.zIndex = 5;
        }
      }
      async function onUp(ev){
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        bar.style.cursor = '';
        if(!moved) return;
        ganttDragMoved = true;
        const dx = ev.clientX - startX;
        const deltaDays = Math.round(dx / zoom);
        if(deltaDays!==0) await moveTaskDates(taskId, deltaDays);
        else render(); // snap back visually
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
}
async function moveTaskDates(taskId, deltaDays){
  const t = state.tasks.find(x=>x.id===taskId); if(!t || !t.start) return;
  const newStart = isoOf(addDays(t.start, deltaDays));
  if(t.duration>0){
    // preserve the same number of WORKING days — recompute due, skipping weekends
    t.start = newStart;
    t.due = addWorkdays(newStart, t.duration);
  } else if(t.due){
    // no estimation set — just shift both dates by the same number of calendar days
    const span = daysBetween(t.start, t.due);
    t.start = newStart;
    t.due = isoOf(addDays(newStart, span));
  } else {
    t.start = newStart;
  }
  await saveTasks();
  render();
}
function scrollFromSlider(v){
  const area = document.getElementById('tl-scrollarea'); if(!area) return;
  area.scrollLeft = v;
}
function panTimeline(days){
  const area = document.getElementById('tl-scrollarea'); if(!area) return;
  const zoom = state.timelineZoom || 26;
  area.scrollLeft += days*zoom;
}
function setZoom(z){
  const area = document.getElementById('tl-scrollarea');
  if(area){ const maxScroll = Math.max(1, area.scrollWidth-area.clientWidth); state.timelineScrollFrac = area.scrollLeft/maxScroll; }
  state.timelineZoom = z;
  document.getElementById('view').innerHTML = renderTimelineView();
  wireTimelineControls();
  wireTimelineDrag();
  wireTimelineResize();
  wireOtherColsSync();
}
function scrollToToday(){
  const area = document.getElementById('tl-scrollarea'); if(!area) return;
  const zoom = state.timelineZoom || 26;
  const tasks = filteredTasksForTimeline().filter(t=>t.start && t.due);
  if(tasks.length===0) return;
  const starts = tasks.map(t=>new Date(t.start));
  let min = addDays(new Date(Math.min(...starts)), -4);
  const offset = daysBetween(min, todayISO())*zoom;
  area.scrollLeft = Math.max(0, offset - area.clientWidth/2);
}

function warningReason(t){
  const reasons = [];
  if(isOverdue(t)) reasons.push('Overdue');
  const d = dependencyStatus(t);
  if(d.state==='warn' || d.state==='unknown') reasons.push(d.text || 'Dependency issue');
  return reasons.join(' · ');
}
function warningRowMini(t){
  return `<div class="dash-task-row" onclick="openDrawer('${t.id}')">
    <div class="dash-task-main">
      <span class="task-id mono">${t.id}</span>
      <span>${esc(t.name)}</span>
    </div>
    <div class="dash-task-side">
      <span class="row" style="gap:5px">${avatarsForNames(t.assignees,16)}${esc(assigneeNamesLabel(t.assignees))}</span>
      <span class="dep-warn">${esc(warningReason(t))}</span>
    </div>
  </div>`;
}
function ownerTaskBreakdown(){
  const owners = {};
  function bucket(name){
    if(!owners[name]){ owners[name] = {}; STATUSES.forEach(s=>owners[name][s]=0); }
    return owners[name];
  }
  state.tasks.forEach(t=>{
    const names = (t.assignees && t.assignees.length) ? t.assignees : ['Unassigned'];
    names.forEach(name=>{
      const b = bucket(name);
      if(STATUSES.includes(t.status)) b[t.status]++;
    });
  });
  return Object.keys(owners).map(name=>{
    const counts = owners[name];
    const total = STATUSES.reduce((s,st)=>s+counts[st],0);
    return {name, counts, total};
  }).sort((a,b)=>b.total-a.total);
}

function memberReportStats(memberName){
  const mine = state.tasks.filter(t=>(t.assignees||[]).includes(memberName));
  const total = mine.length;
  const completed = mine.filter(t=>t.status==='Completed');
  const completedLate = completed.filter(t=> t.completedAt && t.due && t.completedAt > t.due).length;
  const revisions = mine.reduce((s,t)=> s + (t.revisionCount||0), 0);
  const revisionRate = total>0 ? revisions/total : 0;
  return {total, completedCount: completed.length, completedLate, revisions, revisionRate};
}

        <span class="forum-post-title">${esc(p.title)}</span>
        <span class="tagpill" style="background:${sColor}29;color:${sColor};border:1px solid ${sColor}66">${p.status}</span>
      </div>
      ${p.description?`<div class="forum-post-desc">${esc(p.description)}</div>`:''}
      <div class="forum-post-meta">
        <button class="forum-vote-btn ${voted?'voted':''}" onclick="event.stopPropagation();toggleVote('${p.id}')">▲ ${votes.length}</button>
        <span>💬 ${comments.length}</span>
        <span>by ${esc(p.author||'Someone')} · ${fmtWhen(p.ts)}</span>
      </div>
    </div>`;
  }).join('');

  return filterBar + cards;
}

async function toggleVote(postId){
  if(!state.currentUser){ toast('Sign in with Google first — top of the sidebar'); return; }
  const p = state.forumPosts.find(x=>x.id===postId); if(!p) return;
  if(!p.votes) p.votes = [];
  if(p.votes.includes(state.currentUser)) p.votes = p.votes.filter(v=>v!==state.currentUser);
  else p.votes.push(state.currentUser);
  await saveForumPosts();
  render();
  if(state.drawerTaskId==='post:'+postId) document.getElementById('drawer').innerHTML = renderPostDrawerContent(postId);
}

function openNewPostDrawer(){

function openPostDrawer(postId){

        <select ${canManage?'':'disabled'} onchange="setPostStatus('${p.id}',this.value)">
          ${FORUM_STATUSES.map(s=>`<option value="${s}" ${p.status===s?'selected':''}>${s}</option>`).join('')}

              <div style="flex:1;min-width:0">

                  </div>

            </div>`).join('') : '<div class="chat-empty">No comments yet.</div>'}

async function setPostStatus(postId, status){
  if(!isSupervisor()){ toast('Only Supervisors can change status'); return; }
  const p = state.forumPosts.find(x=>x.id===postId); if(!p) return;
  p.status = status;
  await saveForumPosts();
  render();
}
async function postForumComment(postId){
  if(!state.currentUser){ toast('Sign in with Google first — top of the sidebar'); return; }
  const input = document.getElementById('post-comment-input');
  const text = input.value.trim();
  if(!text) return;
  const p = state.forumPosts.find(x=>x.id===postId); if(!p) return;
  if(!p.comments) p.comments = [];
  p.comments.push({id:uid('c'), author: state.currentUser, text, ts: Date.now()});
  await saveForumPosts();
  document.getElementById('drawer').innerHTML = renderPostDrawerContent(postId);
  render();
}
async function deleteForumComment(postId, commentId){
  if(!confirm('Delete this comment?')) return;
  const p = state.forumPosts.find(x=>x.id===postId); if(!p) return;
  p.comments = (p.comments||[]).filter(c=>c.id!==commentId);
  await saveForumPosts();
  document.getElementById('drawer').innerHTML = renderPostDrawerContent(postId);
  render();
}
async function deletePost(postId){
  if(!confirm('Delete this post? This cannot be undone.')) return;
  state.forumPosts = state.forumPosts.filter(x=>x.id!==postId);
  await saveForumPosts();
  closeDrawer();
  render();
}

/* ============================= DOCUMENTS (index of files kept in OneDrive/Drive/etc.) ============================= */
function driveFolderId(url){
  if(!url) return '';
  const m = url.match(/\/folders\/([a-zA-Z0-9_-]+)/);
  return m ? m[1] : '';
}
async function loadDriveFolder(folderId){
  state.driveLoading = true;
  if(state.view==='documents') render();
  try{
    state.driveFiles = await driveApiList(folderId);
  }catch(e){
    console.error(e);
    toast('Could not load that folder — try signing in again');
    state.driveFiles = [];
  }
  state.driveLoading = false;
  if(state.view==='documents') render();
}
function driveNavigateTo(folderId, name){
  state.driveBreadcrumb.push({id: folderId, name});
  state.driveCurrentFolderId = folderId;
  state.driveFiles = null;
  loadDriveFolder(folderId);
}
function driveNavigateBreadcrumb(index){
  state.driveBreadcrumb = state.driveBreadcrumb.slice(0, index+1);
  state.driveCurrentFolderId = state.driveBreadcrumb[index].id;
  state.driveFiles = null;
  loadDriveFolder(state.driveCurrentFolderId);
}
function driveCardClick(el){
  const isFolder = el.dataset.isFolder === 'true';
  if(isFolder){ driveNavigateTo(el.dataset.fileId, el.dataset.fileName); return; }
  const f = (state.driveFiles||[]).find(x=>x.id===el.dataset.fileId);
  if(!f) return;
  const isImage = f.mimeType && f.mimeType.startsWith('image/');
  const isVideo = f.mimeType && f.mimeType.startsWith('video/');
  if(isImage || isVideo){ openDriveMedia(f, isVideo); return; }
  if(f.webViewLink) window.open(f.webViewLink, '_blank');
}
let currentDriveMediaUrl = null;
async function openDriveMedia(f, isVideo){
  const content = document.getElementById('drive-lightbox-content');
  const link = document.getElementById('drive-lightbox-link');
  link.href = f.webViewLink || '#';
  content.innerHTML = `<div class="faint" style="padding:40px">Loading…</div>`;
  document.getElementById('drive-lightbox-hint').textContent = '';
  document.getElementById('drive-lightbox').classList.add('open');
  try{
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`, { headers: driveHeaders() });
    if(!res.ok) throw new Error('fetch failed: '+res.status);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    currentDriveMediaUrl = url;
    content.innerHTML = isVideo
      ? `<video src="${url}" controls autoplay></video>`
      : `<img id="drive-lightbox-img" src="${url}">`;
    document.getElementById('drive-lightbox-hint').textContent = isVideo ? '' : 'Scroll to zoom · drag to pan · double-click to reset';
    if(!isVideo) wireImageZoom(document.getElementById('drive-lightbox-img'));
  }catch(e){
    console.error(e);
    content.innerHTML = `<div class="faint" style="padding:40px;text-align:center">Couldn't load a preview — try "Open in Google Drive" below.</div>`;
  }
}
function closeDriveMedia(){
  document.getElementById('drive-lightbox').classList.remove('open');
  document.getElementById('drive-lightbox-content').innerHTML = ''; // also stops any playing video
  document.getElementById('drive-lightbox-hint').textContent = '';
  if(currentDriveMediaUrl){ URL.revokeObjectURL(currentDriveMediaUrl); currentDriveMediaUrl = null; }
}
async function driveUploadFiles(fileList){
  const files = Array.from(fileList || []);
  if(files.length===0) return;
  toast(`Uploading ${files.length} file${files.length>1?'s':''}…`);
  try{
    for(const f of files){ await driveApiUpload(f, state.driveCurrentFolderId); }
    toast('Upload complete');
    await loadDriveFolder(state.driveCurrentFolderId);
  }catch(err){ console.error(err); toast('Upload failed'); }
}
async function driveHandleUpload(e){
  await driveUploadFiles(e.target.files);
  e.target.value = '';
}
function driveHandleDragOver(e){
  e.preventDefault();
  e.currentTarget.classList.add('drive-drag-over');
}
function driveHandleDragLeave(e){
  e.currentTarget.classList.remove('drive-drag-over');
}
function driveHandleDrop(e){
  e.preventDefault();
  e.currentTarget.classList.remove('drive-drag-over');
  driveUploadFiles(e.dataTransfer.files);
}
async function driveCreateFolderPrompt(){
  const name = prompt('New folder name:');
  if(!name) return;
  try{
    await driveApiCreateFolder(name, state.driveCurrentFolderId);
    await loadDriveFolder(state.driveCurrentFolderId);
  }catch(err){ console.error(err); toast('Could not create folder'); }
}
async function driveRenamePrompt(cardEl){
  const id = cardEl.dataset.fileId, oldName = cardEl.dataset.fileName;
  const name = prompt('Rename to:', oldName);
  if(!name || name===oldName) return;
  try{
    await driveApiRename(id, name);
    await loadDriveFolder(state.driveCurrentFolderId);
  }catch(err){ console.error(err); toast('Could not rename'); }
}
function driveStartMove(cardEl){
  state.driveMovePending = { fileId: cardEl.dataset.fileId, name: cardEl.dataset.fileName, fromFolderId: state.driveCurrentFolderId };
  render();
}
async function driveDeletePrompt(cardEl){
  const id = cardEl.dataset.fileId, name = cardEl.dataset.fileName;
  const isFolder = cardEl.dataset.isFolder === 'true';
  const msg = isFolder
    ? `Move the folder "${name}" and everything inside it to Google Drive's trash? You can restore it from Drive's Trash for 30 days.`
    : `Move "${name}" to Google Drive's trash? You can restore it from Drive's Trash for 30 days.`;
  if(!confirm(msg)) return;
  try{
    await driveApiTrash(id);
    toast('Moved to trash');
    await loadDriveFolder(state.driveCurrentFolderId);
  }catch(err){ console.error(err); toast('Could not delete'); }
}
function driveCancelMove(){ state.driveMovePending = null; render(); }
async function driveCompleteMove(){
  const mv = state.driveMovePending;
  if(!mv) return;
  if(mv.fromFolderId === state.driveCurrentFolderId){ toast("That's already this file's folder"); return; }
  try{
    await driveApiMove(mv.fileId, state.driveCurrentFolderId, mv.fromFolderId);
    toast('Moved');
    state.driveMovePending = null;
    await loadDriveFolder(state.driveCurrentFolderId);
  }catch(err){ console.error(err); toast('Could not move that file'); }
}
function driveSignOut(){
  driveAccessToken = null;
  state.driveSignedIn = false;
  state.driveFiles = null;
  state.driveMovePending = null;
  render();
}
function renderDriveBrowser(){
  const breadcrumbHtml = state.driveBreadcrumb.map((b,i)=>
    `<span class="chat-action-link" onclick="driveNavigateBreadcrumb(${i})">${esc(b.name)}</span>`
  ).join(' <span class="faint">/</span> ');

  const moveBanner = state.driveMovePending
    ? `<div class="chat-reply-banner" style="margin-bottom:10px">
        Moving "${esc(state.driveMovePending.name)}" — open the destination folder, then
        <span class="chat-action-link" onclick="driveCompleteMove()">Move here</span>
        <span class="close" onclick="driveCancelMove()">✕</span>
      </div>` : '';

  const toolbar = `<div class="row" style="gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center">
    <label class="btn btn-sm">📤 Upload files<input type="file" multiple style="display:none" onchange="driveHandleUpload(event)"></label>
    <button class="btn btn-sm btn-ghost" onclick="driveCreateFolderPrompt()">📁 New folder</button>
    <span class="faint" style="font-size:11px">or drag files anywhere in this box</span>
  </div>`;

  let listHtml;
  if(state.driveLoading || state.driveFiles===null){
    listHtml = `<div class="faint" style="padding:20px 0;text-align:center">Loading…</div>`;
  } else if(state.driveFiles.length===0){
    listHtml = `<div class="faint" style="padding:20px 0;text-align:center">This folder is empty.</div>`;
  } else {
    listHtml = `<div class="doc-grid">${state.driveFiles.map(f=>{
      const isFolder = f.mimeType==='application/vnd.google-apps.folder';
      const icon = isFolder ? '📁' : (f.mimeType && f.mimeType.startsWith('image/')) ? '🖼' : (f.mimeType && f.mimeType.startsWith('video/')) ? '🎬' : '📄';
      const thumb = f.thumbnailLink
        ? `<img src="${esc(f.thumbnailLink)}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${icon}'}))">`
        : icon;
      return `<div class="doc-card" data-file-id="${esc(f.id)}" data-file-name="${esc(f.name)}" data-is-folder="${isFolder}" onclick="driveCardClick(this)">
        <div class="doc-thumb">${thumb}</div>
        <div class="doc-card-body">
          <div class="doc-card-name" title="${esc(f.name)}">${esc(f.name)}</div>
          <div class="doc-card-meta">
            <span class="chat-action-link" onclick="event.stopPropagation();driveRenamePrompt(this.closest('.doc-card'))">Rename</span>
            <span class="chat-action-link" onclick="event.stopPropagation();driveStartMove(this.closest('.doc-card'))">Move</span>
            <span class="chat-action-link" onclick="event.stopPropagation();driveDeletePrompt(this.closest('.doc-card'))">Delete</span>
          </div>
        </div>
      </div>`;
    }).join('')}</div>`;
  }

  return `<div class="card dash-list-card" id="drive-dropzone" ondragover="driveHandleDragOver(event)" ondragleave="driveHandleDragLeave(event)" ondrop="driveHandleDrop(event)">
    <div class="row" style="justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:8px">
      <h3 style="margin:0">Team drive</h3>
      <div class="row" style="gap:8px">
        <a href="${esc(state.project.driveUrl)}" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-ghost" style="text-decoration:none">Open in Google Drive ↗</a>
        <button class="btn btn-sm btn-ghost" onclick="driveSignOut()">Sign out</button>
      </div>
    </div>
    <div class="faint" style="margin-bottom:10px">${breadcrumbHtml}</div>
    ${moveBanner}
    ${toolbar}
    ${listHtml}
  </div>`;
}

function autoEmbedUrl(url){
  if(!url) return '';
  const gdriveFile = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
  if(gdriveFile) return `https://drive.google.com/file/d/${gdriveFile[1]}/preview`;
  const gdriveFolder = url.match(/drive\.google\.com\/drive\/folders\/([^/?]+)/);
  if(gdriveFolder) return `https://drive.google.com/embeddedfolderview?id=${gdriveFolder[1]}#list`;
  const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/);
  if(yt) return `https://www.youtube.com/embed/${yt[1]}`;
  if(/\.(png|jpe?g|gif|webp|svg|mp4|webm|ogg)(\?.*)?$/i.test(url)) return url;
  return '';
}
function suggestEmbedUrl(url){
  const embedField = document.getElementById('new-doc-embed-url');
  if(!embedField || embedField.value.trim()) return; // don't overwrite a manual entry
  const guess = autoEmbedUrl(url);
  if(guess) embedField.value = guess;
}

async function updateField(id, field, value){
  const t = state.tasks.find(x=>x.id===id); if(!t) return;
  const oldStatus = t.status;
  t[field] = value;
  if(field==='status'){
    if(value==='Needs Revision' && oldStatus!=='Needs Revision'){
      t.revisionCount = (t.revisionCount||0)+1;
    }
    if(value==='Completed'){
      if(!t.completedAt) t.completedAt = todayISO();
    } else {
      t.completedAt = null;
    }
  }
  if((field==='start' || field==='duration') && t.start && t.duration>0){
    t.due = addWorkdays(t.start, t.duration);
  }
  await saveTasks();
  render();
  if(state.drawerTaskId===id){
    const scrollY = document.querySelector('.drawer-body')?.scrollTop || 0;
    document.getElementById('drawer').innerHTML = renderDrawerContent(id);
    renderChat(id);
    const db = document.querySelector('.drawer-body'); if(db) db.scrollTop = scrollY;
  }
}
async function toggleDep(id, otherId){
  const t = state.tasks.find(x=>x.id===id); if(!t) return;
  if(t.dependsOn.includes(otherId)) t.dependsOn = t.dependsOn.filter(d=>d!==otherId);
  else t.dependsOn.push(otherId);
  await saveTasks();
  document.getElementById('drawer').innerHTML = renderDrawerContent(id);
  renderChat(id);
  render();
}

function resizeImage(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h && w>maxDim){ h=h*maxDim/w; w=maxDim; } else if(h>maxDim){ w=w*maxDim/h; h=maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
let replyingTo = null;   // {id, author, snippet}
let editingMsgId = null; // id of message currently being edited
let mentionPickerOpen = false;

function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function renderMentionText(text){
  let html = esc(text);
  const names = state.team.map(m=>m.name).filter(Boolean).sort((a,b)=>b.length-a.length);
  names.forEach(name=>{
    const re = new RegExp('@'+escapeRegExp(esc(name))+'(?![\\w])', 'g');
    html = html.replace(re, `<span class="mention">@${esc(name)}</span>`);
  });
  return html;
}
function extractMentions(text){
  const names = state.team.map(m=>m.name).filter(Boolean).sort((a,b)=>b.length-a.length);
  const found = new Set();
  names.forEach(name=>{
    const re = new RegExp('@'+escapeRegExp(name)+'(?![\\w])');
    if(re.test(text)) found.add(name);
  });
  return [...found];
}

async function renderChat(taskId){
  const wrap = document.getElementById('chat-thread');
  if(!wrap) return;
  const msgs = await loadChat(taskId);
  if(!document.getElementById('chat-thread')) return; // drawer may have closed while awaiting

  const banner = document.getElementById('chat-reply-banner');
  if(banner){
    banner.innerHTML = replyingTo
      ? `<div class="chat-reply-banner">Replying to <b>${esc(replyingTo.author)}</b>: ${esc(replyingTo.snippet)}<span class="close" onclick="cancelReply('${taskId}')">✕</span></div>`
      : '';
  }

  if(msgs.length===0){
    document.getElementById('chat-thread').innerHTML = '<div class="chat-empty">No messages yet — start the conversation.</div>';
    return;
  }
  const lastIdxByAuthor = {};
  msgs.forEach((m,i)=>{ lastIdxByAuthor[m.author] = i; });

  document.getElementById('chat-thread').innerHTML = msgs.map((m,i)=>{
    const isMine = m.author===state.currentUser;
    const isMyLast = isMine && lastIdxByAuthor[m.author]===i;
    if(editingMsgId===m.id){
      return `<div class="chat-msg">
        <div class="chat-avatar">${esc((m.author||'?').slice(0,1).toUpperCase())}</div>
        <div style="flex:1;min-width:0">

            <div class="chat-meta"><b>${esc(m.author)}</b> · editing</div>
            <textarea id="edit-input-${m.id}">${esc(m.text)}</textarea>
            <div class="row">
              <button class="btn btn-sm btn-gold" onclick="saveEditedMessage('${taskId}','${m.id}')">Save</button>
              <button class="btn btn-sm btn-ghost" onclick="cancelEditMessage('${taskId}')">Cancel</button>
            </div>
          </div>
        </div>
      </div>`;
    }
    return `<div class="chat-msg">
      <div class="chat-avatar">${esc((m.author||'?').slice(0,1).toUpperCase())}</div>
      <div style="flex:1;min-width:0">
        <div class="chat-bubble">
          <div class="chat-meta">
            <b>${esc(m.author||'Someone')}</b> · ${fmtWhen(m.ts)}${m.edited?' · edited':''}
            <span class="chat-actions">
              <span class="chat-action-link" onclick="replyToMessage('${taskId}','${m.id}')">Reply</span>
              ${isMyLast?`<span class="chat-action-link" onclick="startEditMessage('${taskId}','${m.id}')">Edit</span>
              <span class="chat-action-link" onclick="deleteMessage('${taskId}','${m.id}')">Delete</span>`:''}
            </span>
          </div>
          ${m.replyTo?`<div class="chat-reply-quote">↩ ${esc(m.replyTo.author)}: ${esc(m.replyTo.snippet)}</div>`:''}
          ${m.text?`<div class="chat-text">${renderMentionText(m.text)}</div>`:''}
          ${m.driveFile && m.driveFile.thumbnailLink
            ? `<img class="chat-img" src="${esc(m.driveFile.thumbnailLink)}" data-task-id="${esc(taskId)}" data-msg-id="${esc(m.id)}" onclick="openLightbox('${esc(driveThumbLarge(m.driveFile.thumbnailLink,1600))}')" onerror="chatImgError(this)">`
            : (m.image?`<img class="chat-img" src="${m.image}" onclick="openLightbox('${m.image}')">`:'')}
        </div>

  }).join('');
  wrap.parentElement.querySelector('.chat-thread')?.scrollIntoView({block:'nearest'});
}
function fmtWhen(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}) + ' ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}
function replyToMessage(taskId, msgId){
  loadChat(taskId).then(msgs=>{
    const m = msgs.find(x=>x.id===msgId); if(!m) return;
    const snippet = (m.text||'(image)').slice(0,60) + ((m.text||'').length>60?'…':'');
    replyingTo = {id:m.id, author:m.author, snippet};
    renderChat(taskId);
    const input = document.getElementById('chat-input'); if(input) input.focus();
  });
}
function cancelReply(taskId){ replyingTo = null; renderChat(taskId); }
function startEditMessage(taskId, msgId){ editingMsgId = msgId; renderChat(taskId); }
function cancelEditMessage(taskId){ editingMsgId = null; renderChat(taskId); }
async function saveEditedMessage(taskId, msgId){

  await renderChat(taskId);
}
async function deleteMessage(taskId, msgId){
