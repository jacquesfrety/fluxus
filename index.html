function toggleMentionPicker(taskId){
  mentionPickerOpen = !mentionPickerOpen;
  const el = document.getElementById('mention-picker');
  if(!el) return;
  if(!mentionPickerOpen){ el.innerHTML=''; return; }
  el.innerHTML = `<div class="mention-picker">${
    state.team.length ? state.team.map(m=>`
      <div class="mention-picker-item" onclick="insertMention('${esc(m.name)}')">${avatarForMember(m,18)}<span>${esc(m.name)}</span></div>
    `).join('') : '<div class="faint" style="padding:6px 9px">No team members yet</div>'
  }</div>`;
}
function insertMention(name){
  const input = document.getElementById('chat-input');
  if(input){
    const sep = input.value && !input.value.endsWith(' ') && !input.value.endsWith('\n') ? ' ' : '';
    input.value += sep + '@' + name + ' ';
    input.focus();
  }
  mentionPickerOpen = false;
  const el = document.getElementById('mention-picker'); if(el) el.innerHTML = '';
}
async function postMessage(taskId){
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if(!text && !pendingImageFile) return;
  if(!state.currentUser){ toast("Sign in with Google first — top of the sidebar"); return; }
  const msg = {id:uid('m'), author: state.currentUser, text, ts: Date.now()};
  if(pendingImageFile){
    if(!state.driveSignedIn){
      toast('Sign in with Google (Documents page) to attach a photo');
      return;
    }
    if(!driveFolderId(state.project.driveUrl)){
      toast('No team drive folder is set for this project yet — ask a Supervisor to add one in Project Settings');
      return;
    }
    const task = state.tasks.find(x=>x.id===taskId);
    try{
      const folderId = await ensureTaskDriveFolder(task);
      const uploaded = await driveApiUpload(pendingImageFile, folderId);
      msg.driveFile = { id: uploaded.id, name: uploaded.name, thumbnailLink: uploaded.thumbnailLink||'', webViewLink: uploaded.webViewLink||'' };
    }catch(err){
      console.error(err);
      toast('Could not upload the photo — message not sent');
      return;
    }
  }
  const msgs = await loadChat(taskId);
  if(replyingTo) msg.replyTo = {id:replyingTo.id, author:replyingTo.author, snippet:replyingTo.snippet};
  msgs.push(msg);
  await saveChat(taskId, msgs);

  const task = state.tasks.find(x=>x.id===taskId);
  const taskName = task ? task.name : taskId;
  const snippet = (text||'(photo)').slice(0,60) + (text.length>60?'…':'');

  if(replyingTo && replyingTo.author && replyingTo.author!==state.currentUser){
    await addNotification(replyingTo.author, 'reply', taskId, taskName, state.currentUser, snippet);
  }
  const mentioned = extractMentions(text).filter(n=>n!==state.currentUser);
  for(const name of mentioned){
    await addNotification(name, 'tag', taskId, taskName, state.currentUser, snippet);
  }

  input.value = ''; pendingImageFile = null; replyingTo = null;
  document.getElementById('chat-preview-wrap').innerHTML = '';
  await renderChat(taskId);
}
function wireImageZoom(img){
  let scale=1, tx=0, ty=0, dragging=false, startX=0, startY=0, startTx=0, startTy=0;
  const MIN=1, MAX=4;
  img.draggable = false;
  img.addEventListener('dragstart', (e)=> e.preventDefault());
  function apply(){
    img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    img.style.cursor = scale>1 ? 'grab' : 'zoom-in';
  }
  img.style.transform = ''; // reset from any previous instance
  img.addEventListener('wheel', (e)=>{
    e.preventDefault();
    scale = Math.max(MIN, Math.min(MAX, scale + (e.deltaY<0 ? 0.3 : -0.3)));
    if(scale<=1){ scale=1; tx=0; ty=0; }
    apply();
  }, {passive:false});
  img.addEventListener('pointerdown', (e)=>{
    if(scale<=1) return;
    dragging=true; startX=e.clientX; startY=e.clientY; startTx=tx; startTy=ty;
    img.style.cursor='grabbing';
    img.setPointerCapture(e.pointerId);
  });
  img.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    tx = startTx + (e.clientX-startX);
    ty = startTy + (e.clientY-startY);
    apply();
  });
  img.addEventListener('pointerup', ()=>{ dragging=false; img.style.cursor = scale>1?'grab':'zoom-in'; });
  img.addEventListener('dblclick', ()=>{
    scale = scale>1 ? 1 : 2.5;
    tx=0; ty=0;
    apply();
  });
  apply();
}
function openLightbox(src){
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
  wireImageZoom(img);
}
function closeLightbox(){ document.getElementById('lightbox').classList.remove('open'); }

/* ============================= project switcher ============================= */
async function listProjects(){
  if(!db) return [];
  try{
    const snap = await db.collection('projects').orderBy('createdAt','desc').get();
    const out = [];
    snap.forEach(d=> out.push(Object.assign({id:d.id}, d.data())));
    return out;
  }catch(e){ console.error(e); return []; }
}
async function createProject(name, seedExample){
  const ref = db.collection('projects').doc();
  await ref.set({name, createdAt: Date.now(), memberEmails: []});
  state.projectId = ref.id;
  lsSet('activeProjectId', ref.id);
  if(seedExample){
    seedData();
    await Promise.all([saveTeam(), saveCategories(), saveTaskListGroups(), saveTasks()]);
  }
  return ref.id;
}
async function openProject(id){
  state.projectId = id;
  lsSet('activeProjectId', id);
  await enterApp();
}
function switchProject(){
  state.projectId = null;
  localStorage.removeItem('activeProjectId');
  document.getElementById('app').style.display = 'none';
  showPicker();
}
function showNotAMember(){
  localStorage.removeItem('activeProjectId');
  const picker = document.getElementById('picker');
  document.getElementById('app').style.display = 'none';
  picker.style.display = 'flex';
  picker.innerHTML = `
    <div class="picker-card">
      <div class="brand" style="padding:0 0 18px;justify-content:center">
        <div class="brand-mark"></div>
        <div><div class="brand-name">Fluxus</div><div class="brand-sub">Project Tracker</div></div>
      </div>
      <h2 style="margin:0 0 4px;font-size:16px;text-align:center">Not a member</h2>
      <div class="faint" style="text-align:center;margin-bottom:16px">You're signed in as ${esc(authUser.email)}, but you're not on this project's team.</div>
      <button class="btn btn-gold" style="width:100%;justify-content:center" onclick="switchProject()">Back to my projects</button>
    </div>`;
  state.projectId = null;
}
async function enterApp(){
  document.getElementById('picker').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  // clear any Drive folder state left over from a previously-open project
  state.driveCurrentFolderId = null;
  state.driveBreadcrumb = [];
  state.driveFiles = null;
  state.driveMovePending = null;
  await loadAll();
  if(state.team.length > 0 && !state.currentUser){
    // an existing team exists here, but this signed-in account isn't on it — block entry
    showNotAMember();
    return;
  }
  if(state.driveSignedIn){
    // already signed in this session — just re-point at this project's own folder
    const rootId = driveFolderId(state.project.driveUrl);
    state.driveCurrentFolderId = rootId;
    state.driveBreadcrumb = [{id: rootId, name: 'Team drive'}];
  }
  render();
  if(state.driveSignedIn && state.driveCurrentFolderId){
    loadDriveFolder(state.driveCurrentFolderId);
  }
}
async function showPicker(){
  const picker = document.getElementById('picker');
  document.getElementById('app').style.display = 'none';
  picker.style.display = 'flex';

  if(!authUser){
    picker.innerHTML = `
      <div class="picker-card">
        <div class="brand" style="padding:0 0 18px;justify-content:center">
          <div class="brand-mark"></div>
          <div><div class="brand-name">Fluxus</div><div class="brand-sub">Project Tracker</div></div>
        </div>
        <h2 style="margin:0 0 4px;font-size:16px;text-align:center">Sign in to continue</h2>
        <div class="faint" style="text-align:center;margin-bottom:16px">Sign in with Google to see and open your projects</div>
        <button class="btn btn-gold" style="width:100%;justify-content:center" onclick="signInApp()">Sign in with Google</button>
      </div>`;
    return;
  }

  picker.innerHTML = `<div class="picker-card"><div class="faint" style="text-align:center">Loading projects…</div></div>`;
  const allProjects = db ? await listProjects() : [];
  const myEmail = (authUser.email||'').toLowerCase();
  const projects = allProjects.filter(p => Array.isArray(p.memberEmails) && p.memberEmails.includes(myEmail));
  const dbWarning = db ? '' : `<div class="warn-box">Not connected to the database — check your internet connection and reload.</div>`;
  picker.innerHTML = `
    <div class="picker-card">
      <div class="brand" style="padding:0 0 18px;justify-content:center">
        <div class="brand-mark"></div>
        <div><div class="brand-name">Fluxus</div><div class="brand-sub">Project Tracker</div></div>
      </div>
      ${dbWarning}
      <h2 style="margin:0 0 4px;font-size:16px;text-align:center">Choose a project</h2>
      <div class="faint" style="text-align:center;margin-bottom:16px">One shared tool, separate data per project</div>
      ${projects.length ? `<div class="picker-list">${projects.map(p=>`
        <div class="picker-item" onclick="openProject('${p.id}')">
          <span>${esc(p.name)}</span><span class="faint" style="font-size:11px">${p.createdAt?fmtWhen(p.createdAt):''}</span>
        </div>`).join('')}</div>` : `<div class="faint" style="text-align:center;margin-bottom:16px">No projects yet — create the first one below.</div>`}
      <div class="field" style="margin-top:16px"><label>New project name</label><input id="picker-new-name" placeholder="e.g. 141 Neil Road"></div>
      <label class="row" style="gap:7px;font-size:12.5px;color:var(--ink-dim);margin-bottom:12px">
        <input type="checkbox" id="picker-seed-example"> Start with example data (categories, sample tasks)
      </label>
      <button class="btn btn-gold" style="width:100%;justify-content:center" onclick="createProjectFromPicker()">+ Create project</button>
      <div style="text-align:center;margin-top:14px">
        <span class="faint" style="font-size:11px">${esc(authUser.email)}</span> ·
        <span class="chat-action-link" style="font-size:11px" onclick="signOutApp()">Sign out</span>
      </div>
    </div>`;
}
async function createProjectFromPicker(){
  const name = document.getElementById('picker-new-name').value.trim();
  if(!name){ toast('Name is required'); return; }
  const seed = document.getElementById('picker-seed-example').checked;
  await createProject(name, seed);
  await enterApp();
}

/* ============================= init ============================= */
(async function init(){
  await authReady;
  const saved = lsGet('activeProjectId', null);
  if(saved && db && authUser){
    try{
      const snap = await db.collection('projects').doc(saved).get();
      if(snap.exists){
        const data = snap.data();
        const myEmail = (authUser.email||'').toLowerCase();
        if(Array.isArray(data.memberEmails) && data.memberEmails.includes(myEmail)){
          state.projectId = saved;
          await enterApp();
          return;
        }
        // remembered project, but no longer (or never) a member here — don't try to enter it
        localStorage.removeItem('activeProjectId');
      }
    }catch(e){ console.error(e); }
  }
  await showPicker();
})();
</script>
